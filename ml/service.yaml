# SERVICE — gives pods a stable address
# "Expose titanic-api on port 30000"
apiVersion: v1
kind: Service
metadata:
  name: titanic-service
spec:
  type: NodePort           # accessible from outside
  selector:
    app: titanic-api       # routes to titanic pods
  ports:
  - port: 8000             # internal port
    targetPort: 8000       # pod port
    nodePort: 30000        # external port you access
